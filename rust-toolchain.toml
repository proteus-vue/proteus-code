# 工具链钉版。原因:桌面窗口层(wry/tao)的传递依赖树里,若干包的
# 最新版已使用 edition2024(需要 cargo >= 1.85)。Cargo.lock 里已把
# 这些依赖钉在 1.83 兼容版本(idna_adapter / hashbrown / indexmap /
# num_enum / dlopen2_derive,见 PROJECT_MEMORY §4.56 与桌面窗口层
# 的提交说明);再钉住工具链,防止一次 `cargo update` 把树漂移到
# 本工具链无法解析的状态。
#
# 注意：本文件必须是**合法 TOML**。写成裸文本 `1.83.0` 会让 rustup 拒绝
# 解析 override，本仓库内每一条 cargo 命令都会在编译前直接失败
# （"could not parse override file"）—— 纯文本钉版只有无扩展名的
# `rust-toolchain` 才支持，带 `.toml` 后缀必须用 [toolchain] 表。
[toolchain]
channel = "1.83.0"
