[package]
name = "neo-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "L1 平台：进程加固 / 文件系统通知 / git 辅助"

[dependencies]
neo-protocol = { path = "../neo-protocol", version = "0.2.0" }
# 工作区文件索引的遍历。为什么用它而不是自己 read_dir 递归：
# 它正是 ripgrep 的遍历引擎 —— `.gitignore` / `.ignore` / 隐藏文件 / 符号链接
# 成环 这些语义已经有大量实践检验过；自己写一遍必然在某个边界上错
#（最典型的是忘记跳过隐藏文件，于是列出 .git/ 内部结构）。
ignore = { version = "0.4", default-features = false }
# 文件系统事件监听（工作区变化 → 文件树自动更新）。
#
# # 为什么可以接受它进来（以及代价是什么）
#
# 它**本就在依赖树里**（gpui-component → gpui-kit → neo-ui-kit），所以对桌面
# 宿主是零新增编译成本。但声明在这里意味着**内核轴**（neo-core 及其下游）也会
# 拿到它 —— 这是本仓第一次为一个"界面能力"扩展内核依赖，故说明取舍：
#   - 它与 `file_index`（扫描）是**同一件事的两半**（"工作区里有什么文件"），
#     拆到两处会让两个宿主各接一遍监听（"改一处忘一处"的老问题）；
#   - 版本与依赖树里已有的**对齐为 7**，不会编译出两份 notify；
#   - 许可 CC0-1.0（公共领域），在许可守卫的允许列表内。
# 若将来发现"只有桌面宿主需要它"，正确做法是把它下沉到独立 crate
#（而不是在各宿主里各写一份）。
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

