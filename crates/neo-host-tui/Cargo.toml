[package]
name = "neo-host-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "L5 宿主：终端（零依赖，自写 ANSI 渲染）"

# L5 HOST: TUI。不含业务逻辑，只做渲染 + 输入解析 + 消费事件流。
#
# **零依赖**：终端控制用 `stty`（原始终端模式）+ ANSI 转义序列自己写，
# 不引 ratatui/crossterm。理由与本项目其它地方一致 —— 调试链要浅：
# 终端模式设错时，只需查一个文件而不是翻几层 crate 的抽象。
[dependencies]
neo-protocol = { path = "../neo-protocol", version = "0.1.0" }
neo-core = { path = "../neo-core", version = "0.1.0" }
neo-config = { path = "../neo-config", version = "0.1.0" }
neo-platform = { path = "../neo-platform", version = "0.1.0" }
neo-capability = { path = "../neo-capability", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
