[package]
name = "neo-host-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

# L5 HOST: TUI。不含业务逻辑，只做渲染 + 输入解析 + 消费事件流。
#
# **零依赖**：终端控制用 `stty`（原始终端模式）+ ANSI 转义序列自己写，
# 不引 ratatui/crossterm。理由与本项目其它地方一致 —— 调试链要浅：
# 终端模式设错时，只需查一个文件而不是翻几层 crate 的抽象。
[dependencies]
neo-protocol = { path = "../neo-protocol" }
neo-core = { path = "../neo-core" }
neo-config = { path = "../neo-config" }
neo-capability = { path = "../neo-capability" }
serde = { workspace = true }
serde_json = { workspace = true }
