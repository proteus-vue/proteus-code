[package]
name = "neo-sandbox-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "L3 PROVIDER：SandboxBackend 的本机实现（macOS Seatbelt 等）"

# L3 PROVIDER：neo-core 定义的 SandboxBackend SPI 的**本机实现**。
#
# 为什么是 L3 而不是 L1：SPI 的契据（trait）定义在 L2 core，
# 实现必须能依赖契据，故落在 L3。L1 的 neo-sandbox 只负责"把 argv 包裹成
# 受限形式"，是被本 crate 复用的**更低层工具**，不是同一个 seam。
[dependencies]
neo-protocol = { path = "../neo-protocol", version = "0.2.0" }
neo-core = { path = "../neo-core", version = "0.2.0" }
# 真 PTY（unix 交互会话）。跨平台接口；resize/stdin 走它。
portable-pty = "0.9"
