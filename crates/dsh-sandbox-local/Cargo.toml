[package]
name = "dsh-sandbox-local"
version.workspace = true
edition.workspace = true
license.workspace = true

# L3 PROVIDER：dsh-core 定义的 SandboxBackend SPI 的**本机实现**。
#
# 为什么是 L3 而不是 L1：SPI 的契据（trait）定义在 L2 core，
# 实现必须能依赖契据，故落在 L3。L1 的 dsh-sandbox 只负责"把 argv 包裹成
# 受限形式"，是被本 crate 复用的**更低层工具**，不是同一个 seam。
[dependencies]
dsh-protocol = { path = "../dsh-protocol" }
dsh-core = { path = "../dsh-core" }
