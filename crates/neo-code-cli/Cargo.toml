[package]
name = "neo-code-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "`neo` multitool 入口：TUI / Web / Desktop / exec 四宿主共用一个内核"
# 产品名是 neo：CLI 入口就该叫 neo（用法/帮助里一直是 neo）。
# 包名是 neo-code-cli（crates.io 上 neo-cli 已被占用），bin 名不受影响。
autobins = false

[[bin]]
name = "neo"
path = "src/main.rs"

# `neo` multitool 入口。只做参数解析与装配 —— 业务在 L2/L3，渲染在 L5 宿主。
[dependencies]
neo-protocol = { path = "../neo-protocol", version = "0.1.0" }
neo-core = { path = "../neo-core", version = "0.1.0" }
neo-config = { path = "../neo-config", version = "0.1.0" }
neo-capability = { path = "../neo-capability", version = "0.1.0" }
neo-exec = { path = "../neo-exec", version = "0.1.0" }
neo-host-tui = { path = "../neo-host-tui", version = "0.1.0" }
neo-host-web = { path = "../neo-host-web", version = "0.1.0" }
neo-host-desktop = { path = "../neo-host-desktop", version = "0.1.0", optional = true }
neo-sandbox-local = { path = "../neo-sandbox-local", version = "0.1.0" }
neo-llm-deepseek = { path = "../neo-llm-deepseek", version = "0.1.0" }
neo-session-local = { path = "../neo-session-local", version = "0.1.0" }
neo-session-store = { path = "../neo-session-store", version = "0.1.0" }
neo-providers = { path = "../neo-providers", version = "0.1.0" }
serde_json = { workspace = true }

[features]
# 桌面宿主 = 系统 webview 窗口，是唯一引入**平台图形依赖**的宿主：
# wry/tao 在 Linux 上需要 libwebkit2gtk（构建期 pkg-config + 运行期动态库），
# 而只想用 TUI / exec / web 的用户并不需要它。故拆成可选 feature：
#   cargo install neo-code-cli                          # 含桌面（默认）
#   cargo install neo-code-cli --no-default-features    # 精简，Linux 免 webkit
# 默认**开启**是为了让门控代码总被编译（不腐烂）；CI 另跑
# `--no-default-features` 验证精简组合仍有产物。
default = ["desktop"]
desktop = ["dep:neo-host-desktop"]

# 驱动线程的单测用离线桩（内存持久化 / 确定性断言）
[dev-dependencies]
neo-mock = { path = "../neo-mock", version = "0.1.0" }
