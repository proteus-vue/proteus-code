[package]
name = "neo-code-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "`neo` multitool 入口：TUI / Web / Desktop / exec / app-server 五宿主共用一个内核"
# 产品名是 neo：CLI 入口就该叫 neo（用法/帮助里一直是 neo）。
# 包名是 neo-code-cli（crates.io 上 neo-cli 已被占用），bin 名不受影响。
autobins = false

[[bin]]
name = "neo"
path = "src/main.rs"

# `neo` multitool 入口。只做参数解析与装配 —— 业务在 L2/L3，渲染在 L5 宿主。
[dependencies]
neo-protocol = { path = "../neo-protocol", version = "0.1.0" }
neo-core = { path = "../neo-core", version = "0.1.0" }
neo-config = { path = "../neo-config", version = "0.1.0" }
neo-capability = { path = "../neo-capability", version = "0.1.0" }
neo-exec = { path = "../neo-exec", version = "0.1.0" }
neo-host-tui = { path = "../neo-host-tui", version = "0.1.0" }
neo-host-web = { path = "../neo-host-web", version = "0.1.0" }
# stdio JSON-RPC 宿主（`neo app-server`）：给编辑器/IDE 这类已有自己进程的
# 客户端一条通用线协议。纯标准库，不进任何 feature 门 —— 精简构建也该有它。
neo-host-appserver = { path = "../neo-host-appserver", version = "0.1.0" }
neo-host-desktop = { path = "../neo-host-desktop", version = "0.1.0", optional = true }
# 桌面原生 GUI（egui）。与 webview 版并存：ADR-0006 决定不押注单一方案。
neo-host-egui = { path = "../neo-host-egui", version = "0.1.0", optional = true }
# GPUI 宿主（NEO 的下一代桌面 UI；阶段 1 为 opt-in，默认仍是 egui）
neo-host-gpui = { path = "../neo-host-gpui", version = "0.1.0", optional = true }
# 共享内核驱动：CLI 需要为 egui/gpui 两种句柄各实现一次 KernelAccess
neo-driver = { path = "../neo-driver", version = "0.1.0" }
neo-sandbox-local = { path = "../neo-sandbox-local", version = "0.1.0" }
neo-llm-deepseek = { path = "../neo-llm-deepseek", version = "0.1.0" }
neo-session-local = { path = "../neo-session-local", version = "0.1.0" }
neo-session = { path = "../neo-session", version = "0.1.0" }
neo-session-store = { path = "../neo-session-store", version = "0.1.0" }
neo-providers = { path = "../neo-providers", version = "0.1.0" }
serde_json = { workspace = true }

[features]
# 桌面宿主 = 系统 webview 窗口，是唯一引入**平台图形依赖**的宿主：
# wry/tao 在 Linux 上需要 libwebkit2gtk（构建期 pkg-config + 运行期动态库），
# 而只想用 TUI / exec / web 的用户并不需要它。故拆成可选 feature：
#   cargo install neo-code-cli                          # 含桌面（默认）
#   cargo install neo-code-cli --no-default-features    # 精简，Linux 免 webkit
# 默认**开启**是为了让门控代码总被编译（不腐烂）；CI 另跑
# `--no-default-features` 验证精简组合仍有产物。
#
# `egui` 也进默认：`neo desktop` 按计划就该是**原生 GUI**，若它不在默认里，
# 用户不装就得到一句"未编译"—— 那等于默认行为与文档不符。两条路仍可分别关闭：
#   cargo install neo-code-cli --no-default-features            # 只要 TUI/exec/web
#   cargo install neo-code-cli --no-default-features -F desktop # 只要 webview 桌面
#
# 注：egui 的 crate 是 workspace 成员，`cargo check --workspace` **无论如何都会
# 编译它** —— 所以把它放进默认并不新增 Linux 构建面，只是让 CLI 的接线分支
# 也进 CI（否则那段 `#[cfg(feature = "egui")]` 无人编译，正是"腐烂"的成因）。
# GPUI 转正（2026-09）：**默认原生 GUI 是 gpui**。
#
# 转正的依据是 D1–D11 parity 已覆盖，且 gpui 领先三项（思考轨迹搜索、
# 工具调用分组、只在底部才跟随的自动跟随）。切换前逐项核对过 egui 的能力，
# 没有发现 gpui 缺失的项。
#
# egui 仍留在默认里：它还没删（阶段 3 的下一步）。两个宿主并存期间，
# `neo desktop --egui` 可回到旧实现 —— 留一条退路比"切了就回不去"稳妥。
default = ["desktop", "gpui", "egui"]
desktop = ["dep:neo-host-desktop"]
# 原生 GUI（旧实现，冻结中：只修 bug，不加功能）。它已经不再是默认，
# 但**仍在 default 里**：删掉会让"回退到 egui"需要重新编译安装。
egui = ["dep:neo-host-egui"]
# GPUI 宿主：默认的原生 GUI。
gpui = ["dep:neo-host-gpui"]

# 驱动线程的单测用离线桩（内存持久化 / 确定性断言）
[dev-dependencies]
neo-mock = { path = "../neo-mock", version = "0.1.0" }
