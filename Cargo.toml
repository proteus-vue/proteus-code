[workspace]
resolver = "2"
members = [
  "crates/neo-protocol",
  "crates/neo-sandbox",
  "crates/neo-platform",
  "crates/neo-session",
  "crates/neo-config",
  "crates/neo-core",
  "crates/neo-capability",
  "crates/neo-orchestration",
  "crates/neo-host-tui",
  "crates/neo-host-web",
  "crates/neo-host-desktop",
  "crates/neo-exec",
  "crates/neo-code-cli",
  "crates/neo-mock",
  "crates/neo-sandbox-local",
  "crates/neo-llm-deepseek",
  "crates/neo-session-local",
  "crates/neo-session-store",
  "crates/neo-skill-loader",
  "crates/neo-instructions",
  "crates/neo-providers",
  "crates/neo-mcp",
  "crates/neo-agent-loader",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/proteus-vue/proteus-code"
homepage = "https://github.com/proteus-vue/proteus-code"
authors = ["Proteus Contributors"]
# 与 rust-toolchain.toml 的钉版一致；crates.io 上会作为最低 Rust 版本展示。
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
