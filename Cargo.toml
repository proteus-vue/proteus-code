[workspace]
resolver = "2"
members = [
  "crates/neo-protocol",
  "crates/neo-sandbox",
  "crates/neo-platform",
  "crates/neo-session",
  "crates/neo-config",
  "crates/neo-core",
  "crates/neo-capability",
  "crates/neo-orchestration",
  "crates/neo-host-tui",
  "crates/neo-host-web",
  "crates/neo-host-desktop",
  "crates/neo-exec",
  "crates/neo-cli",
  "crates/neo-mock",
  "crates/neo-sandbox-local",
  "crates/neo-llm-deepseek",
  "crates/neo-session-local",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
