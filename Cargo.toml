[workspace]
resolver = "2"
members = [
  "crates/neo-protocol",
  # 宿主中立的文本语义（语义色调 / 显示宽度 / Markdown / 词法高亮）。
  # 独立成 crate 的原因：多个宿主要用同一份，而 A3 禁止宿主互相依赖。
  "crates/neo-text",
  # UI 栈（与内核轴正交的另一条轴）：kit → render → behavior → ui。
  # 四层独立成 crate 是为了将来**整目录复制出去开源**（渲染框架 + 组件库），
  # 由门禁 check_ui_layering.py 保证它们不反向依赖内核轴。
  "crates/neo-ui-kit",
  "crates/neo-ui-render",
  "crates/neo-ui-behavior",
  "crates/neo-ui",
  "crates/neo-sandbox",
  "crates/neo-platform",
  "crates/neo-session",
  "crates/neo-config",
  "crates/neo-core",
  # GUI 宿主的共享内核驱动（A3 禁止宿主互依赖，故下沉到宿主之下）。
  # 守着一件很贵的事：driving 边界守卫丢弃越界 Pump —— 漏了会多花真实模型请求。
  "crates/neo-driver",
  "crates/neo-capability",
  "crates/neo-orchestration",
  "crates/neo-host-tui",
  "crates/neo-host-web",
  "crates/neo-host-desktop",
  "crates/neo-host-egui",
  "crates/neo-host-gpui",
  "crates/neo-exec",
  "crates/neo-code-cli",
  "crates/neo-mock",
  "crates/neo-sandbox-local",
  "crates/neo-llm-deepseek",
  "crates/neo-session-local",
  "crates/neo-session-store",
  "crates/neo-skill-loader",
  "crates/neo-instructions",
  "crates/neo-providers",
  "crates/neo-mcp",
  "crates/neo-agent-loader",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/proteus-vue/proteus-code"
homepage = "https://github.com/proteus-vue/proteus-code"
authors = ["Proteus Contributors"]
# 与 rust-toolchain.toml 的钉版一致；crates.io 上会作为最低 Rust 版本展示。
rust-version = "1.95"

# ── 发布档：体积与调试信息的取舍 ────────────────────────────────────────
#
# 方案 §7 的性能预算里有一条明确的：**release 二进制 < 30MB（剥离符号后）**。
# 而此前全仓**没有 `[profile.release]`** —— 于是那条预算从未被满足过：
# 实测 38MB（release 默认带调试符号，而 gpui/wgpu 那棵树很大）。
#
# 为什么 `strip = "symbols"` 而不是 `"debuginfo"`：
#   - `symbols` 去掉符号表**与**调试信息（体积收益最大）；
#   - 代价是崩溃栈会变成地址而无法符号化 —— 而崩溃上报链路**尚未做**
#     （缺口表挂着）。等接上 Sentry 之类时，正确做法是**同时产出并上传
#     .dSYM / .pdb**（`split-debuginfo`），而不是把符号留在发布产物里。
#     这条注释就是那个"将来做崩溃上报时要回来改"的锚点。
#
# `panic = "abort"`：不引入 —— 内核依赖"工具边界可安全中断"的语义（M1 验收），
# 而 abort 会让某些 panic 处理路径失效。体积不是拿正确性换的。
#
# `lto`：开 thin。实测代价可接受（构建时间），收益是体积与运行速度。不用 fat：
# 那会让全量构建明显变慢，而这个项目的迭代频率高（一天十几个提交）。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
# ── UI 栈：全仓唯一的 GPUI pin ──────────────────────────────────────────
#
# 单一 pin 是 GPUI 生态的生命线：若有两个 crate 各自声明不同来源/版本的 gpui，
# Cargo 会编译两份引擎，报出 `expected gpui::WindowContext, found gpui::WindowContext`
# 这种极难定位的错误（类型名字一样、身份不同）。
#
# 因此只在这里写版本，且**只有 neo-ui-kit 允许依赖它**（由 check_ui_layering.py
# 机器强制）。pin `gpui-kit` 而不是 `gpui-ce`，理由是实测：gpui-kit 把
# gpui(pre) / platform / base / component / assets 全带齐且版本自洽，
# 而 `gpui_platform` 并未发布到 crates.io —— 手工声明会直接报错。
# 版本 pin（单一来源）。**不要在这里加 features** —— 尤其不要加
# `test-support`：那会把它编进**所有**构建，包括 release 二进制
#（测试基建不该出现在发布产物里）。需要它的测试经 `neo-ui-kit` 的
# `test-support` feature 按需打开。
gpui-kit = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
