# 发布:打 tag（v*）时构建预编译二进制 → 上传 GitHub Release → 发布 npm 包。
#
# 用户不需要 Rust 工具链 —— 下载即用（见 scripts/install.sh）或 npm 安装。
#
# ⚠️ **只有 tag 推送（或手动 dispatch）会走发布流水线。推到 main 不会。**
# 日常发版是 changeset 流程：合并 Version PR 后由 changeset-release.yml 打 tag。
#
# 手动重跑/补发：
#   gh workflow run release.yml -f version=0.1.0     # 从 main（含最新修复）
# **不要** `--ref v0.1.0`：workflow_dispatch 用的是**该 ref 处**的 workflow 文件，
# 若那个 tag 早于本次修复，跑的仍是旧文件（这是个真实踩过的坑）。
#
# 产物矩阵（诚实边界）：
#   macOS  aarch64 + x86_64  —— 含桌面窗口（系统 WebKit，无额外依赖）
#   Linux  x86_64            —— **精简版**（--no-default-features）：
#                             桌面宿主在 Linux 要 libwebkit2gtk；预编译二进制
#                             动态链接它会让纯 TUI 用户也被迫装 webkit，
#                             故 Linux 产物不含桌面（用法提示会说清）。
#                             需要 Linux 桌面窗口的用户自行 cargo install（含默认 feature）。
#
# 工具链版本由 rust-toolchain.toml 钉定（1.95.0），与 rust.yml 同一把尺子。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本，如 0.1.0（会建/更新 Release v<版本>）。留空 = 只干跑构建，不发 Release、不发 npm。"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 唯一的「决策」job：定版本、定要不要真发。
  #
  # 两条触发路径取值规则不同，这里集中处理，下游只看 outputs：
  #   tag 推送        → 版本取自 tag，且**必须等于 Cargo.toml 的版本**（漂移即拒绝）
  #   workflow_dispatch → 版本取自 inputs.version；留空则只干跑
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: 定版本
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          IN_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          CARGO_VERSION=$(python3 - <<'PY'
          import re
          src = open("Cargo.toml", encoding="utf-8").read()
          m = re.search(r'\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"',
                          src, re.M | re.S)
          print(m.group(1) if m else "")
          PY
          )
          [ -n "$CARGO_VERSION" ] || { echo "::error::无法从 Cargo.toml 读出 [workspace.package] version"; exit 1; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${IN_VERSION:-}" ]; then
              V="$IN_VERSION"; PUBLISH=true
              echo "手动触发：发布 ${V}"
            else
              V="$CARGO_VERSION"; PUBLISH=false
              echo "手动触发且未给 version —— 只干跑构建，不建 Release、不发 npm"
            fi
          else
            [ "$REF_TYPE" = "tag" ] || { echo "::error::非 tag 推送不应进入发布流程（ref=${REF_NAME}）"; exit 1; }
            V="${REF_NAME#v}"
            PUBLISH=true
            # tag 与 Cargo.toml 必须一致 —— 这是版本漂移的最后一道闸。
            # 历史上这里读 Cargo.toml 会造成"推 v0.1.1 却发 0.1.0"。
            if [ "$V" != "$CARGO_VERSION" ]; then
              echo "::error::tag ${REF_NAME} 的版本（${V}）与 Cargo.toml 的（${CARGO_VERSION}）不一致 —— 拒绝发布。请让两者对齐后重打 tag。"
              exit 1
            fi
            echo "tag 推送：发布 ${V}（与 Cargo.toml 一致）"
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
            # 空 = 走 default feature，**含 GPUI 桌面宿主**（默认桌面 UI）
            # 与 egui（回退通道，尚未删除）。两者都在 default 里，
            # 所以这里不需要显式 --features。
            features: ""
          - os: macos-14          # 交叉编出 Intel 产物
            target: x86_64-apple-darwin
            features: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # 精简版：不含任何 GUI 宿主（免 webkit，也免 gpui 需要的
            # x11/wayland 系统包）。Linux 桌面宿主的发布是另一件事：
            # gpui 在 Linux 上要 libxkbcommon / libwayland / libx11 等，
            # CI 的 rust.yml 已装（供编译检查用），但**发布产物未验证过**。
            features: "--no-default-features"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          target: ${{ matrix.target }}
      # Linux 精简构建**仍**需要少量系统包（TUI 用 stty，无 GUI 依赖）；
      # 这里显式不装 webkit —— 正是为验证精简路径。
      - name: 构建
        run: cargo build --release -p neo-code-cli ${{ matrix.features }} --target ${{ matrix.target }}
      - name: 体积预算检查（方案 §7：< 30MB）
        shell: bash
        run: |
          set -euo pipefail
          # **在这里检查而不是在 verify.sh 里**：verify 跑在 PR 上，那时没有
          # release 产物（fresh checkout 不编 release）；而这里编出来的正是
          # **用户实际下载的那个二进制** —— 在它身上量才算数。
          #
          # 这条预算**真的漏过**：此前全仓没有 `[profile.release]`，而方案
          # 口径是"剥离符号后 <30MB"—— 实测 38MB，从写下那天起就没满足过，
          # 且没有任何东西会因此报警（预算表是文档，不是门禁）。见 §4.64(bo)。
          BIN="target/${{ matrix.target }}/release/neo"
          bytes=$(stat -c%s "$BIN" 2>/dev/null || stat -f%z "$BIN")
          mb=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')
          echo "neo 体积：${mb}MB（预算 30MB）"
          if awk -v m="$mb" 'BEGIN{exit !(m >= 30)}'; then
            echo "::error::release 二进制 ${mb}MB 超出方案 §7 的 30MB 预算"
            echo "先检查 Cargo.toml 的 [profile.release] 是否仍带 strip = \"symbols\""
            exit 1
          fi
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          # 产物名统一用 neo-v<版本>-<target>，与 install.sh 的期望一致
          # （install.sh 下载的是 neo-$tag-$target.tar.gz，tag 含 v 前缀）
          NAME="neo-v${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/neo" "dist/$NAME/neo"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          # 校验和（用户可用 shasum -c 验证）
          ( cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: [resolve-version, build]
    # 只有"真要发"时才建 Release（tag 推送，或手动 dispatch 且给了 version）
    if: needs.resolve-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # 显式指定 tag：手动 dispatch 时 github.ref 是分支，不能靠它推
          tag_name: v${{ needs.resolve-version.outputs.version }}
          files: dist/*.tar.gz*
          generate_release_notes: true

  # npm 发布：把已构建的二进制打成平台包 + 主包（见 scripts/publish-npm.sh）。
  # 与 release job 并列，都吃 build 的产物。
  #
  # 认证两条路（npm 已于 2025-11 移除 Automation/legacy token，只剩 Granular）：
  #   ① OIDC Trusted Publishing —— 推荐，**不需要任何 secret**。在 npmjs.com
  #      各包的 Settings → Trusted Publisher 里指向本仓库 + 本 workflow 文件名。
  #      开关：仓库 Actions 变量 NPM_TRUSTED_PUBLISHING=true
  #   ② Granular access token 存成仓库 secret NPM_TOKEN（read and write）。
  #      注意 npm 计划 2027-01 起移除 granular 的直接发布权限，故 ① 是长期解。
  # 两者都未配置 → 告警跳过，不影响 GitHub Release 产物上传。
  publish-npm:
    needs: [resolve-version, build]
    if: needs.resolve-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC Trusted Publishing + npm provenance 都靠它
    steps:
      - uses: actions/checkout@v4
      # 用 setup-node@v6（而非仓库其它 workflow 用的 v4）：npm 官方可信发布
      # 文档就指定 v6，且 v6 才支持下面这个输入。v4 会报
      # "Unexpected input(s) 'package-manager-cache'" 并附带 Node 20 弃用警告。
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false   # npm 官方对可信发布的建议：别让缓存干扰
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 凭证自检。**失败必须响亮**：曾经这里只 ::warning 后静默跳过，
      # 结果 tag 发布看起来全绿、npm 上却什么都没有（真实踩过）。
      # 现在：把两个候选的就绪状态写进 step summary，且都不就绪时**报错**。
      - name: 检查 npm 认证
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          SKIP: ${{ vars.NPM_SKIP_PUBLISH }}
        run: |
          {
            echo "### npm 认证检查"
            echo ""
            echo "| 候选 | 状态 |"
            echo "|---|---|"
            echo "| Secret \`NPM_TOKEN\` | $([ "$HAS_TOKEN" = "true" ] && echo '✅ 已提供' || echo '❌ 为空/不存在') |"
            echo "| Variable \`NPM_TRUSTED_PUBLISHING\` | $([ "$TRUSTED" = "true" ] && echo '✅ true' || echo "❌ 是 '${TRUSTED:-空}'") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_TOKEN" = "true" ] || [ "$TRUSTED" = "true" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 显式豁免（确实不想在本仓库发 npm 时）
          if [ "$SKIP" = "true" ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_SKIP_PUBLISH=true —— 按配置跳过 npm 发布"
            exit 0
          fi

          echo "ok=0" >> "$GITHUB_OUTPUT"
          cat <<'EOF'
          ❌ 没有任何可用的 npm 凭证，而本仓库被配置为应发布 npm 包。

          最常见的原因（按概率）：
            1) token 加成了 **Variable** 而不是 **Secret**
               → 检查 Settings → Secrets and variables → Actions：
                 `NPM_TOKEN` 必须在 **Secrets** 标签页，不是 Variables。
               → 若确实只想要无密钥的 OIDC 发布，请改用 Trusted Publishing：
                 把 `NPM_TRUSTED_PUBLISHING` 变量设为 true，并在 npmjs.com
                 给每个包配置 Trusted Publisher（注意：包尚不存在时无法配置，
                 首次发布仍需要 token）。
            2) secret 名不是 `NPM_TOKEN`（本 workflow 就找这个名字）
            3) 加在了 Environment 而不是仓库级（本 job 未声明 environment）
            4) 加在了 fork 或别的仓库
            5) 添加时间晚于本次运行 —— 那就重跑本 run 即可

          确认修好后：Actions → release → 选本次 run → "Re-run all jobs"。
          EOF
          exit 1

      - name: 发布到 npm
        if: steps.creds.outputs.ok == '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 版本来自 resolve-version（读 Cargo.toml），不依赖 event ref ——
          # 这样手动重跑也能拿到正确版本。publish-npm.sh 还会再校验一次
          # 它与 Cargo.toml 一致。
          bash scripts/publish-npm.sh \
            --dist dist \
            --version "${{ needs.resolve-version.outputs.version }}"
