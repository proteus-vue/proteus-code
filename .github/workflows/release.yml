# 发布:打 tag（v*）时构建预编译二进制 → 上传 GitHub Release → 发布 npm 包。
#
# 用户不需要 Rust 工具链 —— 下载即用（见 scripts/install.sh）或 npm 安装。
# npm 发布由 publish-npm 这个 job 负责，需要仓库 secret `NPM_TOKEN`；
# 未配置时该 job 只告警跳过，不让 tag 发布整体失败。
#
# 产物矩阵（诚实边界）：
#   macOS  aarch64 + x86_64  —— 含桌面窗口（系统 WebKit，无额外依赖）
#   Linux  x86_64            —— **精简版**（--no-default-features）：
#                             桌面宿主在 Linux 要 libwebkit2gtk；预编译二进制
#                             动态链接它会让纯 TUI 用户也被迫装 webkit，
#                             故 Linux 产物不含 desktop（用法提示会说清）。
#                             需要 Linux 桌面窗口的用户自行 cargo install（含默认 feature）。
#
# 工具链版本由 rust-toolchain.toml 钉定（1.83.0），与 rust.yml 同一把尺子。
name: release

on:
  push:
    tags: ["v*"]
  # 手动触发。两个用途：
  #   ① 用 ref=vX.Y.Z 重试一次失败/部分成功的发布（**推荐这条**）
  #   ② 干跑验证流水线（不传 ref，只出 artifact，不发 Release/npm）
  # 注意：手动触发时 GitHub 不会给 GITHUB_REF_NAME 一个 tag 名（是分支名），
  # 所以**版本一律从 Cargo.toml 读**，不依赖 event ref —— 见 resolve-version。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 版本从 **Cargo.toml** 读，不从 event ref 推。
  # 原因：workflow_dispatch 从分支触发时 GITHUB_REF_NAME 是分支名（如 main），
  # 拿它当版本会得到 `--version main`。Cargo.toml 才是版本真源。
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 读 Cargo.toml 的版本
        id: v
        run: |
          V=$(python3 - <<'PY'
          import re
          src = open("Cargo.toml", encoding="utf-8").read()
          m = re.search(r'\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"',
                          src, re.M | re.S)
          print(m.group(1) if m else "")
          PY
          )
          [ -n "$V" ] || { echo "::error::无法从 Cargo.toml 读出 [workspace.package] version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本（来自 Cargo.toml）：$V"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
            features: ""          # 含桌面
          - os: macos-14          # 交叉编出 Intel 产物
            target: x86_64-apple-darwin
            features: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "--no-default-features"   # 免 webkit 依赖
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.83.0"
          target: ${{ matrix.target }}
      # Linux 精简构建**仍**需要少量系统包（TUI 用 stty，无 GUI 依赖）；
      # 这里显式不装 webkit —— 正是为验证精简路径。
      - name: 构建
        run: cargo build --release -p neo-code-cli ${{ matrix.features }} --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          # 产物名统一用 neo-v<版本>-<target>，与 install.sh 的期望一致
          # （install.sh 下载的是 neo-$tag-$target.tar.gz，tag 含 v 前缀）
          NAME="neo-v${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/neo" "dist/$NAME/neo"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          # 校验和（用户可用 shasum -c 验证）
          ( cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: [resolve-version, build]
    # tag 触发、或用 ref=vX.Y.Z 手动触发时才建 Release；
    # 从分支手动触发（干跑验证）只留 artifact，不建 Release。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz*
          generate_release_notes: true

  # npm 发布：把已构建的二进制打成平台包 + 主包（见 scripts/publish-npm.sh）。
  # 与 release job 并列，都吃 build 的产物。
  #
  # 认证两条路（npm 已于 2025-11 移除 Automation/legacy token，只剩 Granular）：
  #   ① OIDC Trusted Publishing —— 推荐，**不需要任何 secret**。在 npmjs.com
  #      各包的 Settings → Trusted Publisher 里指向本仓库 + 本 workflow 文件名。
  #      开关：仓库 Actions 变量 NPM_TRUSTED_PUBLISHING=true
  #   ② Granular access token 存成仓库 secret NPM_TOKEN（read and write）。
  #      注意 npm 计划 2027-01 起移除 granular 的直接发布权限，故 ① 是长期解。
  # 两者都未配置 → 告警跳过，不影响 GitHub Release 产物上传。
  publish-npm:
    needs: [resolve-version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC Trusted Publishing + npm provenance 都靠它
    steps:
      - uses: actions/checkout@v4
      # Node 24：Trusted Publishing 要求 npm CLI >= 11.5.1（Node 22.14+/24 才带得动）。
      # package-manager-cache: false 是 npm 官方对可信发布的建议（避免缓存干扰）。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 凭证自检。**失败必须响亮**：曾经这里只 ::warning 后静默跳过，
      # 结果 tag 发布看起来全绿、npm 上却什么都没有（真实踩过）。
      # 现在：把两个候选的就绪状态写进 step summary，且都不就绪时**报错**。
      - name: 检查 npm 认证
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          SKIP: ${{ vars.NPM_SKIP_PUBLISH }}
        run: |
          {
            echo "### npm 认证检查"
            echo ""
            echo "| 候选 | 状态 |"
            echo "|---|---|"
            echo "| Secret \`NPM_TOKEN\` | $([ "$HAS_TOKEN" = "true" ] && echo '✅ 已提供' || echo '❌ 为空/不存在') |"
            echo "| Variable \`NPM_TRUSTED_PUBLISHING\` | $([ "$TRUSTED" = "true" ] && echo '✅ true' || echo "❌ 是 '${TRUSTED:-空}'") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_TOKEN" = "true" ] || [ "$TRUSTED" = "true" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 显式豁免（确实不想在本仓库发 npm 时）
          if [ "$SKIP" = "true" ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_SKIP_PUBLISH=true —— 按配置跳过 npm 发布"
            exit 0
          fi

          echo "ok=0" >> "$GITHUB_OUTPUT"
          cat <<'EOF'
          ❌ 没有任何可用的 npm 凭证，而本仓库被配置为应发布 npm 包。

          最常见的原因（按概率）：
            1) token 加成了 **Variable** 而不是 **Secret**
               → 检查 Settings → Secrets and variables → Actions：
                 `NPM_TOKEN` 必须在 **Secrets** 标签页，不是 Variables。
               → 若确实只想要无密钥的 OIDC 发布，请改用 Trusted Publishing：
                 把 `NPM_TRUSTED_PUBLISHING` 变量设为 true，并在 npmjs.com
                 给每个包配置 Trusted Publisher（注意：包尚不存在时无法配置，
                 首次发布仍需要 token）。
            2) secret 名不是 `NPM_TOKEN`（本 workflow 就找这个名字）
            3) 加在了 Environment 而不是仓库级（本 job 未声明 environment）
            4) 加在了 fork 或别的仓库
            5) 添加时间晚于本次运行 —— 那就重跑本 run 即可

          确认修好后：Actions → release → 选本次 run → "Re-run all jobs"。
          EOF
          exit 1

      - name: 发布到 npm
        if: steps.creds.outputs.ok == '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 版本来自 resolve-version（读 Cargo.toml），不依赖 event ref ——
          # 这样手动重跑也能拿到正确版本。publish-npm.sh 还会再校验一次
          # 它与 Cargo.toml 一致。
          bash scripts/publish-npm.sh \
            --dist dist \
            --version "${{ needs.resolve-version.outputs.version }}"
