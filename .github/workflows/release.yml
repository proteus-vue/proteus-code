# 发布:打 tag（v*）时构建预编译二进制 → 上传 GitHub Release → 发布 npm 包。
#
# 用户不需要 Rust 工具链 —— 下载即用（见 scripts/install.sh）或 npm 安装。
# npm 发布由 publish-npm 这个 job 负责，需要仓库 secret `NPM_TOKEN`；
# 未配置时该 job 只告警跳过，不让 tag 发布整体失败。
#
# 产物矩阵（诚实边界）：
#   macOS  aarch64 + x86_64  —— 含桌面窗口（系统 WebKit，无额外依赖）
#   Linux  x86_64            —— **精简版**（--no-default-features）：
#                             桌面宿主在 Linux 要 libwebkit2gtk；预编译二进制
#                             动态链接它会让纯 TUI 用户也被迫装 webkit，
#                             故 Linux 产物不含 desktop（用法提示会说清）。
#                             需要 Linux 桌面窗口的用户自行 cargo install（含默认 feature）。
#
# 工具链版本由 rust-toolchain.toml 钉定（1.83.0），与 rust.yml 同一把尺子。
name: release

on:
  push:
    tags: ["v*"]
  # 允许手动触发以验证流水线（不发 Release，只出 artifact）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
            features: ""          # 含桌面
          - os: macos-14          # 交叉编出 Intel 产物
            target: x86_64-apple-darwin
            features: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "--no-default-features"   # 免 webkit 依赖
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.83.0"
          target: ${{ matrix.target }}
      # Linux 精简构建**仍**需要少量系统包（TUI 用 stty，无 GUI 依赖）；
      # 这里显式不装 webkit —— 正是为验证精简路径。
      - name: 构建
        run: cargo build --release -p neo-code-cli ${{ matrix.features }} --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          NAME="neo-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/neo" "dist/$NAME/neo"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          # 校验和（用户可用 shasum -c 验证）
          ( cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz*
          generate_release_notes: true

  # npm 发布：把已构建的二进制打成平台包 + 主包（见 scripts/publish-npm.sh）。
  # 与 release job 并列，都吃 build 的产物。
  #
  # 认证两条路（npm 已于 2025-11 移除 Automation/legacy token，只剩 Granular）：
  #   ① OIDC Trusted Publishing —— 推荐，**不需要任何 secret**。在 npmjs.com
  #      各包的 Settings → Trusted Publisher 里指向本仓库 + 本 workflow 文件名。
  #      开关：仓库 Actions 变量 NPM_TRUSTED_PUBLISHING=true
  #   ② Granular access token 存成仓库 secret NPM_TOKEN（read and write）。
  #      注意 npm 计划 2027-01 起移除 granular 的直接发布权限，故 ① 是长期解。
  # 两者都未配置 → 告警跳过，不影响 GitHub Release 产物上传。
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC Trusted Publishing + npm provenance 都靠它
    steps:
      - uses: actions/checkout@v4
      # Node 24：Trusted Publishing 要求 npm CLI >= 11.5.1（Node 22.14+/24 才带得动）。
      # package-manager-cache: false 是 npm 官方对可信发布的建议（避免缓存干扰）。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 检查 npm 认证
        id: creds
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 二选一即可：secret（granular token）或变量（已配置可信发布）
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ "${{ vars.NPM_TRUSTED_PUBLISHING }}" = "true" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 npm 认证 —— 跳过 npm 发布（GitHub Release 产物照常）。见 .github/workflows/release.yml 顶部说明"
          fi
      - name: 发布到 npm
        if: steps.creds.outputs.ok == '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # tag 形如 v0.1.0 → 版本 0.1.0
          # 配了 Trusted Publishing 时无需 NODE_AUTH_TOKEN，npm 自动走 OIDC。
          bash scripts/publish-npm.sh --dist dist --version "${GITHUB_REF_NAME#v}"
