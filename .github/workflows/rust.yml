# Rust 全门禁:verify.sh = cargo test --workspace + 零 warning +
# 架构/协议/会话/配置/SPI/Python 守卫 + 执行效率审计。
# 工具链版本由 rust-toolchain.toml 钉定(1.83.0)—— 桌面窗口层的
# 依赖树钉在 1.83 兼容版本,CI 必须用同一把尺子。
name: rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # 全量测试编译+运行,给足余量;卡住的 job 不白占配额
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.83.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # neo-host-desktop(wry/tao)在 Linux 上编译需要 webkit2gtk/gtk 系统包
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev
      # 缓存 target 目录:全量编译从 ~10 分钟降到增量秒级
      - uses: Swatinem/rust-cache@v2
      # 分步执行:失败阶段从 step 结论即可见,不必认证拉日志
      - name: 编译检查(全 target)
        run: cargo check --workspace --all-targets
      - name: 全量测试
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test-out.log
          code=$?
          # 失败定位写进 STEP SUMMARY —— check-run output 字段免认证可读
          {
            echo "## 失败用例"
            grep -E '^test .* FAILED' /tmp/test-out.log | head -20 || true
            echo "## panic 摘要"
            grep -E 'panicked at' /tmp/test-out.log | head -10 || true
            echo "## 编译错误(若有)"
            grep -E '^error(\[|:)' /tmp/test-out.log | head -15 || true
            echo "## 日志尾部"
            tail -c 2500 /tmp/test-out.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: 全门禁
        run: bash scripts/verify.sh
