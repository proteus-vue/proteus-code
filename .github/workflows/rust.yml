# Rust 全门禁:verify.sh = cargo test --workspace + 零 warning +
# 架构/协议/会话/配置/SPI/Python 守卫 + 执行效率审计。
# 工具链版本由 rust-toolchain.toml 钉定(1.95.0),CI 必须用同一把尺子。
name: rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # 全量测试编译+运行,给足余量;卡住的 job 不白占配额
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 两个 GUI 宿主的 Linux 构建前置：
      #   - neo-host-desktop(wry/tao) 需要 webkit2gtk / gtk
      #   - neo-host-gpui(GPUI) 需要 xkbcommon / wayland / x11 / fontconfig
      #     （GPUI 的 X11 走纯 Rust 的 x11rb、Wayland 走 dlopen，所以是
      #      运行时 dlopen 而非编译期链接；这里仍显式装上是**保守选择** ——
      #      少装一个包会让 CI 在链接期报错，多装一个只是几 MB 下载）
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev
      # 缓存 target 目录:全量编译从 ~10 分钟降到增量秒级
      - uses: Swatinem/rust-cache@v2
      # 分步执行:失败阶段从 step 结论即可见,不必认证拉日志
      - name: 编译检查(全 target)
        run: cargo check --workspace --all-targets
      - name: 全量测试
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test-out.log
          code=$?
          # 失败定位写进 STEP SUMMARY
          {
            echo "## 失败用例"
            grep -E '^test .* FAILED' /tmp/test-out.log | head -20 || true
            echo "## panic 摘要"
            grep -E 'panicked at' /tmp/test-out.log | head -10 || true
            echo "## 编译错误(若有)"
            grep -E '^error(\[|:)' /tmp/test-out.log | head -15 || true
            echo "## 日志尾部"
            tail -c 2500 /tmp/test-out.log
          } >> "$GITHUB_STEP_SUMMARY"

          # ⚠️ **同时**输出为 `::error::` 注解。
          #
          # 为什么不能只写 STEP SUMMARY：那个字段**需要 admin 权限**才能通过
          # API 读到（实测 403 "Must have admin rights"），而失败摘要恰恰是
          # 最需要被读到的内容。注解（check-run annotations）是**免认证可读**的
          # —— 本次就是靠它读到了 Node 版本警告，这证明通道可用。
          #
          # 一次 CI 失败的价值全在"能不能定位"，读不到就等于白跑一轮。
          # 失败时把日志尾部**无条件**做成注解。
          #
          # 前两版按 grep 分类（失败用例/panic/编译错误），但实测注解一条都没
          # 出现 —— 说明日志里这三种行首都没有匹配到，而我无法从这里知道
          # 究竟长什么样。**先保证能看到原始输出，再谈分类**：
          # 无条件取尾部 12 行，每行一个注解（注解是唯一免认证可读的通道）。
          # 先无条件报告**诊断元信息**：退出码、日志行数与大小。
          # 这是为了排除"if 块没进入"这类脚本自身的问题 ——
          # 前几版加了注解却一条都没出现，而没有元信息就无法区分
          # "没进 if" 与 "进了但输出被吞"。
          lines=$(wc -l < /tmp/test-out.log 2>/dev/null || echo 0)
          bytes=$(wc -c < /tmp/test-out.log 2>/dev/null || echo 0)
          echo "::error title=诊断::exit=$code lines=$lines bytes=$bytes"

          if [ "$code" -ne 0 ]; then
            echo "=== 失败：日志末尾 40 行 ==="
            tail -40 /tmp/test-out.log
            echo "=== 注解输出（供 API 读取）==="
            tail -40 /tmp/test-out.log | while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error title=日志::${line:0:800}"
            done
          fi
          exit $code
      # 失败时重跑失败用例并打印**完整输出**（--exact 逐条重跑）。
      #
      # 为什么单开这一步：全量测试的日志尾部常常只截到断言消息的一行，
      # 而定位需要看它前后的上下文（哪个断言、期望值、实际值）。
      # 这一步只在失败时跑，成功路径零开销。
      - name: 失败用例详情（仅失败时）
        if: failure()
        run: |
          echo "=== 逐条重跑失败用例（含完整输出）==="
          # 从日志里取失败的用例名（形如 `test foo::bar ... FAILED`）
          grep -E '^test .* FAILED' /tmp/test-out.log \
            | sed -E 's/^test ([^ ]+) .*/\1/' | sort -u > /tmp/failed.txt || true
          if [ ! -s /tmp/failed.txt ]; then
            echo "（日志里没有失败用例行 —— 可能是编译期失败，见下方）"
            grep -E '^error(\[|:)' /tmp/test-out.log | head -20 || true
            exit 0
          fi
          while read -r name; do
            echo ""
            echo "########## $name ##########"
            cargo test --workspace --exact "$name" -- --nocapture 2>&1 | tail -60 || true
          done < /tmp/failed.txt

      - name: 全门禁
        run: bash scripts/verify.sh
