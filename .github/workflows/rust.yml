# Rust 全门禁:verify.sh = cargo test --workspace + 零 warning +
# 架构/协议/会话/配置/SPI/Python 守卫 + 执行效率审计。
# 工具链版本由 rust-toolchain.toml 钉定(1.95.0),CI 必须用同一把尺子。
name: rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # 全量测试编译+运行,给足余量;卡住的 job 不白占配额。
    #
    # 45 → 75：新增 gpui 依赖树（wgpu / gtk / accesskit / zed 的十几个 crate）
    # 进了默认 feature，debug 测试构建明显变长。**超时也是一个候选根因** ——
    # 被超时杀掉的日志特征正是"尾部全是 Compiling、没有 error 行"。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 两个 GUI 宿主的 Linux 构建前置：
      #   - neo-host-desktop(wry/tao) 需要 webkit2gtk / gtk
      #   - neo-host-gpui(GPUI) 需要 xkbcommon / wayland / x11 / fontconfig
      #     （GPUI 的 X11 走纯 Rust 的 x11rb、Wayland 走 dlopen，所以是
      #      运行时 dlopen 而非编译期链接；这里仍显式装上是**保守选择** ——
      #      少装一个包会让 CI 在链接期报错，多装一个只是几 MB 下载）
      - name: 安装 Linux 系统依赖
        run: |
          # ⚠️ `libxkbcommon-x11-dev` **必须装**：gpui 的 Linux 依赖树里有包
          # 在**链接期**要求 `-lxkbcommon-x11`（实测 CI 报
          # `rust-lld: unable to find library -lxkbcommon-x11`），
          # 而 `libxkbcommon-dev` **不含**这个库。
          # 只装前者会得到"编译通过、链接失败" —— 而 `cargo check` 不链接，
          # 所以编译检查步骤照样绿，症状只在 test 阶段出现（我为此查了很久）。
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev
      # 缓存 target 目录:全量编译从 ~10 分钟降到增量秒级
      - uses: Swatinem/rust-cache@v2
      # 分步执行:失败阶段从 step 结论即可见,不必认证拉日志
      # 磁盘与耗时诊断：新增 gpui 依赖树（wgpu / gtk / accesskit 等）后，
      # debug 测试构建的体积与时间都大幅上涨。若日志在编译中途戛然而止，
      # 最可能是**磁盘耗尽**或**超时**，而这两者都不会留下 error 行 ——
      # 那正好解释了"日志尾部全是 Compiling、却没有错误信息"。
      - name: 环境诊断（磁盘）
        run: |
          df -h / /home/runner 2>/dev/null || df -h
          echo "--- 已用缓存 ---"
          du -sh ~/.cargo/registry 2>/dev/null || true
          du -sh target 2>/dev/null || true

      - name: 编译检查(全 target)
        run: |
          time cargo check --workspace --all-targets
          df -h / | tail -1
      - name: 全量测试
        # 关掉颜色：CI 日志里 cargo 默认带 ANSI 转义，而 `^error` 这类
        # **行首锚点会因此永远匹配不上**（行其实以 \x1b[1m 开头）。
        # 我为此白跑了一轮 —— 我的诊断 grep 用了 ^error，结果什么都匹配不到。
        #
        # 失败时由 `scripts/ci-failure-digest.sh` 把原因压成注解（该脚本头部
        # 详述了注解通道的 10 条上限与两类"像错误的正常行"噪声 —— 上一版的
        # 内联 grep 用 `-i 'error|failed'`，10 条配额被 `Compiling thiserror` 与
        # `test result: ok. 0 failed` 吃光，真正的 FAILED 行一条都没发出去）。
        env:
          CARGO_TERM_COLOR: never
        run: |
          # ⚠️ `set +e` **必须**显式关掉：GitHub Actions 的 run 块默认是
          # `bash -e`（出错即退出），所以 `cargo test` 失败后 shell **立刻退出**，
          # 后面所有诊断代码（code=$?、STEP SUMMARY、注解）**一行都不会执行**。
          #
          # 这正是我前面加了三版注解却一条都没出现的原因 —— 不是注解语法问题、
          # 不是 grep 没匹配，而是**那段代码从来没被执行**。
          # 代价：连"exit code 101"都是 GitHub 兜底生成的，我读不到任何细节。
          set +e
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/test-out.log
          code=$?
          # 失败定位写进 STEP SUMMARY
          {
            echo "## 失败用例"
            grep -E '^test .* FAILED' /tmp/test-out.log | head -20 || true
            echo "## panic 摘要"
            grep -E 'panicked at' /tmp/test-out.log | head -10 || true
            echo "## 编译错误(若有)"
            grep -E '^error(\[|:)' /tmp/test-out.log | head -15 || true
            echo "## 日志尾部"
            tail -c 2500 /tmp/test-out.log
          } >> "$GITHUB_STEP_SUMMARY"

          # 一层保障不够：把日志**同时**压成注解 —— 注解（check-run annotations）
          # 是**免认证可读**的，而 job 日志与 STEP SUMMARY 都要 admin 权限
          # （实测 403 "Must have admin rights"）。一次 CI 失败的价值全在
          # "能不能定位"，读不到就等于白跑一轮。
          #
          # ⚠️ 不要在 workflow 里内联 grep。上一版就是这么写的，两个坑：
          #   1. `grep -i 'error|failed'` 会命中 `Compiling thiserror` 与
          #      `test result: ok. 0 failed` 两类**噪声**；
          #   2. 每个 step 只保留**前 10 条** error 注解，其余静默丢弃。
          #   两者叠加 = 10 条配额全给噪声，真正的 FAILED 行一条都发不出去。
          # 故逻辑集中在 `scripts/ci-failure-digest.sh`（按价值排序 + 双通道
          # 各 10 条 + 行首锚定大小写敏感 + 单行化），并**可本地用日志回放验证**。
          lines=$(wc -l < /tmp/test-out.log 2>/dev/null || echo 0)
          bytes=$(wc -c < /tmp/test-out.log 2>/dev/null || echo 0)
          disk=$(df -h / | tail -1 | tr -s ' ' | cut -d' ' -f4)

          if [ "$code" -ne 0 ]; then
            echo "=== 失败：日志末尾 40 行 ==="
            tail -40 /tmp/test-out.log
            echo "=== 注解输出（供 API 读取）==="
            NEO_CI_EXIT="$code" NEO_CI_LINES="$lines" NEO_CI_BYTES="$bytes" NEO_CI_DISK="$disk" \
              bash scripts/ci-failure-digest.sh /tmp/test-out.log
          else
            echo "::notice title=诊断::exit=0 lines=$lines bytes=$bytes 剩余磁盘=$disk"
          fi
          exit $code
      # 失败时重跑失败用例并打印**完整输出**（--exact 逐条重跑）。
      #
      # 为什么单开这一步：全量测试的日志尾部常常只截到断言消息的一行，
      # 而定位需要看它前后的上下文（哪个断言、期望值、实际值）。
      # 这一步只在失败时跑，成功路径零开销。
      - name: 失败用例详情（仅失败时）
        if: failure()
        run: |
          echo "=== 逐条重跑失败用例（含完整输出）==="
          # 从日志里取失败的用例名（形如 `test foo::bar ... FAILED`）
          grep -E '^test .* FAILED' /tmp/test-out.log \
            | sed -E 's/^test ([^ ]+) .*/\1/' | sort -u > /tmp/failed.txt || true
          if [ ! -s /tmp/failed.txt ]; then
            echo "（日志里没有失败用例行 —— 可能是编译期失败，见下方）"
            grep -E '^error(\[|:)' /tmp/test-out.log | head -20 || true
            exit 0
          fi
          while read -r name; do
            echo ""
            echo "########## $name ##########"
            cargo test --workspace --exact "$name" -- --nocapture 2>&1 | tail -60 || true
          done < /tmp/failed.txt

      - name: 全门禁
        run: bash scripts/verify.sh
