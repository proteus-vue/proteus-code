[workspace]
resolver = "2"
members = [
  "crates/dsh-protocol",
  "crates/dsh-sandbox",
  "crates/dsh-platform",
  "crates/dsh-session",
  "crates/dsh-config",
  "crates/dsh-core",
  "crates/dsh-capability",
  "crates/dsh-orchestration",
  "crates/dsh-host-tui",
  "crates/dsh-host-web",
  "crates/dsh-exec",
  "crates/dsh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
